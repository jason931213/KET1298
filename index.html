const $=s=>document.querySelector(s);
const KEY='ket1298_progress_v1';
let progress={};try{progress=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
let category='全部词汇',query='',filtered=[],index=0;
const cats=['全部词汇',...new Set(WORDS.map(w=>w.category))];
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeSave=()=>{try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(e){}};
function refreshCats(){
 $('#cats').innerHTML=cats.map(c=>{const items=c==='全部词汇'?WORDS:WORDS.filter(w=>w.category===c);return `<button class="cat ${category===c?'active':''}" data-cat="${escapeHtml(c)}"><span>${escapeHtml(c)}</span><small>${items.length}</small></button>`}).join('');
 document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;query='';$('#search').value='';index=0;refresh()});
 const known=WORDS.filter(w=>progress[w.id]==='known').length;
 $('#stats').textContent=`已掌握 ${known} / ${WORDS.length}`;
 $('#progress').style.width=(known/WORDS.length*100).toFixed(1)+'%';
}
function refresh(){
 filtered=WORDS.filter(w=>(category==='全部词汇'||w.category===category)&&(!query||[w.word,w.meaning,w.exampleEn].some(x=>String(x).toLowerCase().includes(query))));
 if(index>=filtered.length)index=Math.max(0,filtered.length-1);
 refreshCats();render();
}
function render(){
 const w=filtered[index];$('#scope').textContent=query?'搜索结果':category;$('#count').textContent=`${filtered.length?index+1:0} / ${filtered.length}`;
 if(!w){$('#study').innerHTML='<div class="empty">没有找到符合条件的词汇，请更换搜索内容。</div>';$('#bottom').hidden=true;return}
 $('#bottom').hidden=false;
 $('#study').innerHTML=`<div class="word">${escapeHtml(w.word)}</div><div class="pos">${escapeHtml(w.pos)}</div><button class="audio" data-say="word">🔊 英文单词</button><div class="meaning">${escapeHtml(w.meaning)}</div><button class="audio" data-say="meaning">🔊 中文释义</button><div class="sep"></div><div class="en">${escapeHtml(w.exampleEn)}</div><button class="audio" data-say="example">🔊 英文例句</button><div class="cn">${escapeHtml(w.exampleCn)}</div>`;
 document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say,w));
 document.querySelectorAll('[data-status]').forEach(b=>b.classList.toggle('active',progress[w.id]===b.dataset.status));
}
function speak(type,w){
 if(!('speechSynthesis' in window)){alert('当前浏览器不支持语音合成，请使用新版 Chrome、Safari 或 Edge。');return}
 const en=type!=='meaning',txt=type==='word'?w.word:type==='meaning'?w.meaning.replace(/[；;]/g,'，'):w.exampleEn;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(txt);u.lang=en?'en-GB':'zh-CN';u.rate=type==='word'?.82:.9;u.pitch=1;
 const voices=speechSynthesis.getVoices();const match=voices.find(v=>v.lang.toLowerCase()===(en?'en-gb':'zh-cn'))||voices.find(v=>v.lang.toLowerCase().startsWith(en?'en':'zh'));
 if(match)u.voice=match;
 speechSynthesis.speak(u);
}
$('#search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();index=0;refresh()});
$('#prev').onclick=()=>{if(filtered.length){index=(index+filtered.length-1)%filtered.length;render()}};
$('#next').onclick=()=>{if(filtered.length){index=(index+1)%filtered.length;render()}};
document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{const w=filtered[index];if(!w)return;progress[w.id]=b.dataset.status;safeSave();refreshCats();render()});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')$('#next').click();if(e.key==='ArrowLeft')$('#prev').click()});
refresh();
</script></body></html>
